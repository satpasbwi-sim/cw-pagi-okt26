    window.addEventListener('DOMContentLoaded', () => {
      const sel = document.getElementById('tglSelect');
      const todayDate = new Date().getDate() || 15;
      for (let d = 1; d <= 31; d++) {
        const o = document.createElement('option');
        o.value = d; o.textContent = d + ' Oktober 2026';
        if (d === todayDate) o.selected = true;
        sel.appendChild(o);
      }
      renderAll();
      if (API_URL) syncFromServer();
    });

    function openTab(name) {
      ['absensi','laphar','catatan','rekap'].forEach(t => {
        document.getElementById('view-' + t).classList.add('hidden');
        document.getElementById('nav-' + t).className = 'px-4 py-2.5 border-b-2 border-transparent text-blue-200 whitespace-nowrap';
      });
      document.getElementById('view-' + name).classList.remove('hidden');
      document.getElementById('nav-' + name).className = 'px-4 py-2.5 border-b-2 border-amber-400 text-amber-300 whitespace-nowrap';
    }

    function renderAll() {
      const tgl = parseInt(document.getElementById('tglSelect').value, 10);
      const q = (document.getElementById('searchBox').value || '').toLowerCase();
      const list = (STATE.personel || []).filter(p => p.nama.toLowerCase().includes(q) || p.simpul.toLowerCase().includes(q));

      const counts = { H:0, LD:0, DL:0, I:0, S:0, C:0, TK:0 };
      (STATE.personel || []).forEach(p => {
        const st = (p.absensi && p.absensi[tgl]) ? p.absensi[tgl] : 'H';
        if (counts[st] !== undefined) counts[st]++;
      });

      document.getElementById('statCards').innerHTML = STATUS_CODES.map(k =>
        '<div class="bg-white p-2.5 rounded-xl border text-center"><div class="text-[10px] font-bold text-slate-400">' + k + '</div><div class="text-lg font-extrabold">' + counts[k] + '</div></div>'
      ).join('');

      document.getElementById('listPersonel').innerHTML = list.map(p => {
        const cur = (p.absensi && p.absensi[tgl]) ? p.absensi[tgl] : 'H';
        const btns = STATUS_CODES.map(code =>
          '<button onclick="setSt(' + p.id + ',' + tgl + ',\'' + code + '\')" class="px-2.5 py-1 rounded-lg border text-xs font-extrabold ' + (cur === code ? 'st-' + code : 'bg-slate-50 text-slate-600') + '">' + code + '</button>'
        ).join('');
        return '<div class="p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2"><div><div class="font-bold text-sm">' + p.nama + '</div><div class="text-xs text-slate-500">' + p.pangkat + ' • <b class="text-slate-700">' + p.simpul + '</b></div></div><div class="flex gap-1 flex-wrap">' + btns + '</div></div>';
      }).join('');

      document.getElementById('cPers').innerHTML = (STATE.personel || []).map(p => '<option value="' + p.nama + '|' + p.simpul + '">' + p.nama + ' (' + p.simpul + ')</option>').join('');
      document.getElementById('cBody').innerHTML = (STATE.catatan || []).map(c => '<tr><td class="p-2">' + c.tanggal + '</td><td class="p-2 font-bold">' + c.nama + '</td><td class="p-2">' + c.simpul + '</td><td class="p-2">' + c.alasan + '</td><td class="p-2">' + c.pengganti + '</td><td class="p-2">' + c.ket + '</td></tr>').join('');

        let h=0, ld=0, dl=0, isc=0, tk=0;
        Object.values(p.absensi || {}).forEach(v => {
          if (v==='H') h++; else if (v==='LD') ld++; else if (v==='DL') dl++; else if (v==='TK') tk++; else isc++;
        });
        return '<tr><td class="p-2">' + (i+1) + '</td><td class="p-2 font-bold">' + p.nama + '</td><td class="p-2">' + p.simpul + '</td><td class="p-2 text-center font-bold text-emerald-700">' + h + '</td><td class="p-2 text-center">' + ld + '</td><td class="p-2 text-center">' + dl + '</td><td class="p-2 text-center">' + isc + '</td><td class="p-2 text-center text-red-600">' + tk + '</td></tr>';
      }).join('');
    }

    function setSt(id, tgl, st) {
      const p = STATE.personel.find(x => x.id === id);
      if (p) { if (!p.absensi) p.absensi = {}; p.absensi[tgl] = st; renderAll(); }
    }

    function markAllH() {
      const tgl = parseInt(document.getElementById('tglSelect').value, 10);
      (STATE.personel || []).forEach(p => { if (!p.absensi) p.absensi = {}; p.absensi[tgl] = 'H'; });
      renderAll();
    }

    async function syncFromServer() {
      if (!API_URL) return;
      try {
        const r = await fetch(API_URL + '?action=getAll');
        const j = await r.json();
        if (j.status === 'success') { STATE = j; renderAll(); }
      } catch (e) { console.error(e); }
    }

    async function saveAbsensiToSheet() {
      const tgl = parseInt(document.getElementById('tglSelect').value, 10);
      const records = (STATE.personel || []).map(p => ({ rowNumber: p.rowNumber, status: (p.absensi && p.absensi[tgl]) ? p.absensi[tgl] : 'H' }));
      if (!API_URL) { alert('Tersimpan di memori lokal'); return; }
      await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveAbsensi', tanggal: tgl, records: records }) });
      alert('Absensi tanggal ' + tgl + ' Oktober 2026 berhasil disimpan ke Google Spreadsheet!');
    }

    async function submitCatatan() {
      const [nama, simpul] = document.getElementById('cPers').value.split('|');
      const payload = {
        tanggal: document.getElementById('cTgl').value,
        nama: nama, simpul: simpul,
        alasan: document.getElementById('cAlasan').value,
        pengganti: document.getElementById('cPengganti').value,
        ket: document.getElementById('cKet').value
      };
      STATE.catatan.unshift(payload);
      renderAll();
      if (API_URL) {
        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'saveCatatan', payload: payload }) });
        alert('Catatan berhasil disimpan ke Sheet CATATAN!');
      }
    }

    function copyWA() {
      navigator.clipboard.writeText(document.getElementById('waText').value);
      alert('Format Laporan WA disalin!');
    }
  </script>
</body>
</html>
